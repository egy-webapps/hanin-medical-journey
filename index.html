*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;padding-bottom:72px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:6px 12px}
.brand{font-weight:800;color:#D9B77E;white-space:nowrap;cursor:pointer}
nav.top{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.top a{color:#C9D8EE;padding:6px 10px;border-radius:8px;white-space:nowrap;font-size:.9rem;cursor:pointer}
nav.top a.on{background:#D9B77E;color:#0B1F3A;font-weight:600}
.lg{display:flex;border:1px solid #D9B77E;border-radius:99px;overflow:hidden}

.lg button.on{background:#D9B77E;color:#0B1F3A;font-weight:700}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{margin:.2em 0 .6em;font-size:1.5rem}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g2{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:start;font:inherit;color:inherit;display:block;width:100%}
.tile:active{background:var(--soft)}
.tile b{display:block}.ic{font-size:1.5rem}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:8px 16px;font:inherit;font-weight:600;min-height:44px;cursor:pointer}
.btn.s{background:var(--soft);color:var(--ink)}.btn.gd{background:#D9B77E;color:#0B1F3A}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;min-height:44px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>*{flex:1 1 120px}.row>.btn{flex:0 0 auto}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);font-size:.85rem;margin:2px;cursor:pointer;border:0;color:var(--ink);font-family:inherit}
.chip.on{background:var(--navy);color:#fff}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
.mut{color:var(--mut);font-size:.9rem}.sm{font-size:.95rem}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:36px 18px;text-align:center;min-height:70vh;display:grid;place-content:center;gap:6px}
.hero h1{font-size:clamp(1.8rem,7vw,3.2rem);margin:0;color:#D9B77E;animation:rv 1.6s .2s both}
@keyframes rv{from{clip-path:inset(0 0 100% 0);transform:translateY(10px)}to{clip-path:inset(0);transform:none}}
@keyframes dr{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
.ecg{stroke-dasharray:700;stroke-dashoffset:0;animation:dr 2.4s ease-out}
.hero p{max-width:520px;margin:4px auto;color:#C9D8EE}
.cols{display:flex;gap:6px;align-items:end;height:90px}
.cols div{flex:1;text-align:center;font-size:.7rem}.cols i{display:block;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.fcard{min-height:200px;display:grid;place-content:center;text-align:center;font-size:1.3rem}
.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;min-height:44px}
.opt.ok{background:#D5F0E4;color:#0F5238;border-color:var(--ok)}.opt.no{background:#F8DAD8;color:#7A1F1B;border-color:var(--bad)}
.ph{background:var(--soft);border:1px dashed var(--mut);border-radius:10px;padding:14px;text-align:center;color:var(--mut);font-size:.85rem}
.bn{position:fixed;bottom:0;inset-inline:0;z-index:20;background:var(--navy);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bn a{flex:1;text-align:center;color:#C9D8EE;font-size:.72rem;cursor:pointer;padding:2px}.bn a.on{color:#D9B77E;font-weight:700}.bn span{display:block;font-size:1.25rem}
.gold{border-inline-start:4px solid var(--gold)}
@media(min-width:900px){.bn{display:none}body{padding-bottom:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

return`<div class="row"><b>${Q.i+1}/${Q.qs.length}</b><span>⏱ <span id="qt">${Q.tl}</span></span><span>${t('sc')}: ${Q.sc}</span></div>${bar(pct(Q.i,Q.qs.length))}<div class="c"><div class="mut">${t('qq')}</div><p><b>${E(L?(m[4]||m[3]):m[3])}</b></p>${q.o.map((o,j)=>`<button class="opt ${Q.a===null?'':o===m?'ok':Q.a==j?'no':''}" onclick="qAns(${j})">${en(o[0])}</button>`).join('')}${Q.a!==null?`<p><b>${Q.a>=0&&q.o[Q.a]===m?'✓ '+t('rg'):(Q.a<0?t('tm'):'✗ '+t('wr'))}</b><br>${en(m[0])} = ${m[1]}<br><span class="sm">${E(m[3])}</span></p><button class="btn" onclick="qNext()">${Q.i+1>=Q.qs.length?t('fin'):t('nxt')}</button>`:''}</div>`},
plan(){const td=dk(),tl=S.tasks.map((x,i)=>[x,i]).sort((a,b)=>a[0].dt<b[0].dt?-1:1),pc={h:t('hi'),m:t('md'),l:t('lo')};
return`<h2>${t('plan')}</h2><div class="c"><div class="row"><input id="tt" placeholder="${t('tt')}"><select id="ts">${sel()}</select><input id="td" type="date" value="${td}"><select id="tp"><option value="h">${t('hi')}</option><option value="m" selected>${t('md')}</option><option value="l">${t('lo')}</option></select><button class="btn" onclick="addTask()">${t('add')}</button></div></div>
<div class="c"><b>${t('pom')} — ${PM.m=='f'?t('focus'):t('brk')}</b><div style="font-size:2.4rem;font-weight:800" id="pt">${mmss(PM.l)}</div><div class="row"><button class="btn gd" onclick="pTog()">${t('go_')}</button><button class="btn s" onclick="pRst()">${t('rst')}</button></div><div class="mut">${t('gl')}: ${mins()}/${S.goal}</div>${bar(Math.min(100,pct(mins(),S.goal)))}<div class="row"><input id="gl" type="number" value="${S.goal}" onchange="S.goal=+this.value||60;save();render()"></div></div>
<div class="c"><b>${t('ex')}</b><div class="row"><input id="en" placeholder="${t('en_')}" value="${E(S.ex.n)}"><input id="ed" type="date" value="${S.ex.d}"><button class="btn s" onclick="S.ex={n:v('en'),d:v('ed')};save();render()">${t('sv')}</button></div></div>
<div class="c"><b>${t('cal')}</b><div style="display:grid;gap:4px;grid-template-columns:repeat(7,minmax(0,1fr))">${[0,1,2,3,4,5,6].map(i=>{const k=dk(i);return`<div class="c" style="margin:0;text-align:center;padding:4px 2px;font-size:.72rem;overflow:hidden"><div class="mut">${new Date(k+'T00:00:00').toLocaleDateString(ar()?'ar-EG':'en-US',{weekday:'short'})}</div><b>${S.tasks.filter(x=>x.dt==k&&!x.d).length}</b></div>`}).join('')}</div></div>
<div class="c"><b>${t('tdy')}</b>${tl.length?tl.map(([x,i])=>`<div class="row"><label class="sm" style="flex:1 1 200px"><input type="checkbox" style="width:22px;min-height:22px;vertical-align:middle" ${x.d?'checked':''} onchange="S.tasks[${i}].d^=1;save();render()"> ${x.d?'<s>':''}${E(x.t)}${x.d?'</s>':''} <span class="mut">${E(ar()?S.subs[x.s].ar:S.subs[x.s].en)} · ${x.dt} · ${pc[x.p]}</span></label><button class="chip" onclick="S.tasks.splice(${i},1);save();render()">${t('del')}</button></div>`).join(''):`<p class="mut">${t('none')}</p>`}</div>`},
notes(){return`<h2>${t('notes')}</h2><div class="c"><div class="row"><input id="nt" placeholder="${t('nt')}"><select id="ns">${sel()}</select></div><textarea id="nb" rows="4" placeholder="${t('nb')}"></textarea><div class="row"><button class="btn" onclick="nSave()">${t('sv')}</button></div></div><input id="nq" placeholder="${t('srch')}" oninput="$('#nl').innerHTML=nl()"><div id="nl">${nl()}</div>`},
dict(){const cs=['all','anat','hist','phys','bio','term','cust'];return`<h2>${t('dict')}</h2><p class="mut">${t('smp')}</p><input id="dq" placeholder="${t('srch')}" oninput="$('#dlist').innerHTML=dl()"><div>${cs.map(c=>`<button class="chip ${S.dc==c?'on':''}" onclick="S.dc='${c}';render()">${t(c)}</button>`).join('')}</div><div class="g2" id="dlist">${dl()}</div>`},
prog(){const[a,b]=les(),h=S.qh.slice(-10).map((x,i)=>[i+1,pct(x.s,x.n)]),wc={};S.qh.forEach(x=>x.w.forEach(n=>{const m=ALL().find(y=>y[0]==n);if(m)wc[m[5]]=(wc[m[5]]||0)+1}));const weak=Object.entries(wc).sort((x,y)=>y[1]-x[1]).slice(0,3);const tot=Object.values(S.sec).reduce((x,y)=>x+y,0);
return`<h2>${t('prog')}</h2><p class="mut">${t('wnote')}</p><div class="g"><div class="c"><b>${pct(a,b)}%</b><div class="mut">${t('ov')}</div></div><div class="c"><b>${(tot/3600).toFixed(1)}</b><div class="mut">${t('hrs')}</div></div><div class="c"><b>${a}</b><div class="mut">${t('lp')}</div></div><div class="c"><b>${S.tasks.filter(x=>x.d).length}</b><div class="mut">${t('dn')}</div></div></div>
<div class="c"><b>${t('pn')} (%)</b>${h.length?cols(h):`<p class="mut">${t('none')}</p>`}</div><div class="c"><b>${t('wk')}</b>${cols(wk())}</div>
<div class="c"><b>${t('wa')}</b><div>${weak.length?weak.map(w=>`<span class="chip">${t(w[0])} · ${w[1]}</span>`).join(''):`<span class="mut">${t('none')}</span>`}</div></div>
<div class="c"><b>${t('bysub')}</b>${S.subs.filter(s=>s.les.length).map(s=>`<div class="sm">${E(ar()?s.ar:s.en)}</div>${bar(pct(s.les.filter(l=>l.d).length,s.les.length))}`).join('')||`<p class="mut">${t('none')}</p>`}</div>`},
note(){const m=ar()?'إلى حنين،<br><br>كل رحلة عظيمة تبدأ بخطوة صغيرة.<br><br>أتمنى أن يتحوّل فضولكِ إلى معرفة، وأن يصبح اجتهادكِ نجاحًا، وأن يصير حلمكِ بأن تكوني طبيبة حقيقة جميلة.<br><br>واصلي التعلّم، واصلي الإيمان، ولا تتوقفي عن المضيّ إلى الأمام.<br><br><b>رحلتكِ الطبية تبدأ من هنا.</b>':'To Hanin,<br><br>Every great journey begins with a small step.<br><br>May your curiosity become knowledge, your hard work become success, and your dream of becoming a doctor become a beautiful reality.<br><br>Keep learning, keep believing, and never stop moving forward.<br><br><b>Your Medical Journey Starts Here.</b>';
return`<h2>${t('note')}</h2><div class="hero" style="min-height:0;padding:28px 20px"><svg viewBox="0 0 300 30" width="100%" style="max-width:260px;margin:auto" fill="none" stroke="#D9B77E" stroke-width="2" stroke-linecap="round"><path d="M0 15H100L112 4L126 26L138 10L146 15H300"/></svg><p style="font-size:1.1rem;color:#fff;line-height:2">${m}</p></div>`}};
function sys(A,c){return`<h2>${t(c)}</h2><p class="mut">${t('smp')}</p><div class="g2">${A.map(s=>`<div class="c"><b>${en(s[0])}</b> — ${s[1]}<p class="sm">${s[2]}</p><p class="sm">${s[3]}</p>${IMG[s[0]]?IMG[s[0]]+'<div class="mut" style="text-align:center">'+t('sch')+'</div>':'<div class="ph">'+t('imgp')+'</div>'}<div class="mut">${t('terms')}</div>${s[4].map(x=>`<span class="chip">${en(x[0])} · ${x[1]}</span>`).join('')}</div>`).join('')}</div><button class="btn" onclick="S.qc='${c}';go('quiz')">${t('prc')}</button>`}
function fN(d){const n=ALL().length;FI=(FI+d+n)%n;FR=0;render()}
function addSub(){const n=v('sn').trim();if(!n)return;S.subs.push({en:n,ar:n,bm:0,les:[]});save();render()}
function addLes(i){const n=v('l'+i).trim();if(!n)return;S.subs[i].les.push({t:n,d:0});save();render()}
function addCard(){const a=v('ce').trim(),b=v('ca').trim(),d=v('cd').trim();if(!a||!b)return;S.cust.push([a,b,'',d,d,'cust']);save();FI=ALL().length-1;FR=0;render()}
function addTask(){const x=v('tt').trim();if(!x)return;S.tasks.push({t:x,s:+v('ts'),dt:v('td')||dk(),p:v('tp'),d:0});save();render()}
function nSave(){const x={t:v('nt').trim(),b:v('nb').trim(),s:+v('ns')};if(!x.t&&!x.b)return;if(NE>=0){Object.assign(S.notes[NE],x);NE=-1}else S.notes.push(Object.assign(x,{p:0,d:dk()}));save();render()}
function nEd(i){NE=i;const n=S.notes[i];$('#nt').value=n.t;$('#nb').value=n.b;$('#ns').value=n.s;scrollTo(0,0)}
function nl(){const q=v('nq').toLowerCase(),r=S.notes.map((n,i)=>[n,i]).filter(([n])=>(n.t+n.b).toLowerCase().includes(q)).sort((a,b)=>b[0].p-a[0].p);
return r.length?r.map(([n,i])=>`<div class="c ${n.p?'gold':''}"><b>${E(n.t)}</b> <span class="mut">${E(ar()?S.subs[n.s].ar:S.subs[n.s].en)} · ${n.d}</span><p class="sm" style="white-space:pre-wrap">${E(n.b)}</p><div class="row"><button class="chip" onclick="S.notes[${i}].p^=1;save();render()">📌 ${t('pin')}</button><button class="chip" onclick="nEd(${i})">${t('edit')}</button><button class="chip" onclick="S.notes.splice(${i},1);save();render()">${t('del')}</button></div></div>`).join(''):`<p class="mut">${t('none')}</p>`}
function dl(){const q=v('dq').toLowerCase();return ALL().filter(m=>(S.dc=='all'||m[5]==S.dc)&&(m[0]+m[1]).toLowerCase().includes(q)).map(m=>`<div class="c"><b>${en(m[0])}</b> — ${m[1]}${m[2]?`<div class="mut">${t('pr')}: ${en(m[2])}</div>`:''}<p class="sm">${E(m[3])}</p><p class="sm">${E(m[4]||m[3])}</p><span class="chip">${t(m[5])}</span>${rl(m)}</div>`).join('')||`<p class="mut">${t('none')}</p>`}
const ql=()=>S.ql||S.lang;
function qStart(){const A=ALL().filter(m=>m[3]),pool=A.filter(m=>S.qc=='all'||m[5]==S.qc);if(!pool.length||A.length<4)return;
Q={qs:sh(pool).slice(0,10).map(m=>({m,o:sh([m].concat(sh(A.filter(x=>x[0]!=m[0])).slice(0,3)))})),i:0,sc:0,w:[],a:null,tl:20,c:S.qc};qTick();render()}
function qTick(){clearInterval(Q.iv);Q.iv=setInterval(()=>{if(Q.a!==null)return;Q.tl--;const e=$('#qt');if(e)e.textContent=Q.tl;if(Q.tl<=0)qAns(-1)},1000)}
function qAns(j){if(Q.a!==null)return;Q.a=j;const q=Q.qs[Q.i];if(j>=0&&q.o[j]===q.m)Q.sc++;else Q.w.push(q.m);render()}
function qNext(){if(++Q.i>=Q.qs.length){clearInterval(Q.iv);Q.done=1;S.qh.push({d:dk(),c:Q.c,s:Q.sc,n:Q.qs.length,w:Q.w.map(m=>m[0])});save()}else{Q.a=null;Q.tl=20}render()}
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function pTog(){if(PM.iv){clearInterval(PM.iv);PM.iv=null;save()}else PM.iv=setInterval(pTick,1000)}
function pTick(){PM.l--;if(PM.m=='f'){const k=dk();S.sec[k]=(S.sec[k]||0)+1}
if(PM.l<=0){PM.m=PM.m=='f'?'b':'f';PM.l=PM.m=='f'?1500:300;try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}save();if(pg=='plan')render();return}
const e=$('#pt');if(e)e.textContent=mmss(PM.l);if(PM.l%15==0)save()}
function pRst(){clearInterval(PM.iv);PM.iv=null;PM.m='f';PM.l=1500;save();render()}
const QT=[['كل صفحة تذاكرينها اليوم تقرّبكِ من حلمكِ.','Every page you study today brings you closer to your dream.'],['الاستمرار أهم من الكمال.','Consistency matters more than perfection.'],['اسألي كثيرًا؛ الفضول بداية الفهم.','Ask a lot of questions; curiosity is the start of understanding.'],['استراحة قصيرة تساعد عقلكِ على التركيز.','A short break helps your mind focus.'],['راجعي اليوم ما تعلمتِه أمس.','Review today what you learned yesterday.'],['الطب رحلة طويلة، وخطوة اليوم تُحسب.','Medicine is a long journey, and today’s step counts.'],['أنتِ قادرة على أكثر مما تظنين.','You are capable of more than you think.']];
const dn=()=>Math.floor((Date.now()-tz)/864e5);
function daily(){const A=ALL(),m=A[dn()%A.length],q=QT[dn()%QT.length];return`<div class="c gold"><i>${q[ar()?0:1]}</i></div><div class="c"><b>${t('wod')}:</b> ${en(m[0])} = ${m[1]}<div class="sm">${E(m[3])}</div></div>`}
let DP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;render()});
const inst=()=>DP?`<div style="margin-top:8px"><button class="btn s" onclick="DP.prompt();DP=null;render()">📲 ${t('inst')}</button></div>`:'';
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
pg=location.hash.slice(1)||'home';render();
</script></body></html>
